upstream helpdesk_app {
  server app:3000;
  keepalive 8;
}

server {
  listen 443 ssl;
  http2 on;
  server_name _;

  # Сертификат от доверенного УЦ с полной цепочкой — требование MAX.
  ssl_certificate     /etc/nginx/certs/fullchain.pem;
  ssl_certificate_key /etc/nginx/certs/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Strict-Transport-Security "max-age=31536000" always;
  add_header Content-Security-Policy "default-src 'none'" always;

  # Единственный маршрут, доступный снаружи.
  location = /webhook/max {
    limit_except POST { deny all; }
    limit_req zone=webhook burst=40 nodelay;
    client_max_body_size 64k;

    proxy_pass http://helpdesk_app;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_send_timeout 15s;
    proxy_read_timeout 25s;
  }

  location = /nginx-health {
    access_log off;
    return 200 "ok";
  }

  location / {
    return 404;
  }
}
