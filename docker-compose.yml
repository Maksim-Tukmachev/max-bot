name: max-helpdesk

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [internal]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    # ports: не публикуется — БД доступна только внутри сети compose

  app:
    build:
      context: .
      target: production
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    networks: [internal]
    environment:
      # Корневой УЦ Минцифры: сертификат platform-api2.max.ru выдан им. Доверие только для процесса приложения.
      NODE_EXTRA_CA_CERTS: /etc/ssl/extra/Russian_Trusted_CA.pem
    volumes:
      - ./certs/Russian_Trusted_CA.pem:/etc/ssl/extra/Russian_Trusted_CA.pem:ro
    stop_grace_period: 30s
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:'+(process.env.PORT||3000)+'/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    # ports: не публикуется. В режиме webhook приложение доступно только через nginx.

  # Только для MAX_MODE=webhook (нужен домен и сертификат): docker compose --profile webhook up -d
  nginx:
    profiles: ["webhook"]
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./certs:/etc/nginx/certs:ro
      - nginx-logs:/var/log/nginx
    networks: [internal]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "wget", "-q", "--no-check-certificate", "-O", "/dev/null", "https://127.0.0.1/nginx-health"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  internal: {}

volumes:
  pgdata:
  nginx-logs:
